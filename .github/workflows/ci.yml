name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: tests · ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.13", chromium: true }
          - { os: macos-latest, python: "3.12" }
          - { os: windows-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            skills/web-research-pro/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install Playwright Chromium
        if: matrix.chromium
        run: python -m playwright install --with-deps chromium
      - name: Run tests
        run: python -m pytest -q

  # Python 3.9 is still the default python3 on many Macs (Xcode tools), so keep it working.
  # Newer GitHub runners no longer ship 3.9, hence the official container.
  tests-oldest-python:
    name: tests · Python 3.9 (container)
    runs-on: ubuntu-latest
    container: python:3.9-slim
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests (browser tests skip without Chromium)
        run: python -m pytest -q -rs

  installers:
    name: installer · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install.sh (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          bash install.sh --dir "$RUNNER_TEMP/skills" --no-browser
          "$HOME/.web-research-pro/venv/bin/python" -c "import playwright, trafilatura, pypdf; print('packages ok')"
          python3 "$RUNNER_TEMP/skills/web-research-pro/scripts/doctor.py" --offline || true
          bash install.sh --dir "$RUNNER_TEMP/skills" --uninstall
          test ! -e "$RUNNER_TEMP/skills/web-research-pro"
      - name: install.ps1 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./install.ps1 -Dir "$env:RUNNER_TEMP\skills" -NoBrowser
          & "$HOME\.web-research-pro\venv\Scripts\python.exe" -c "import playwright, trafilatura, pypdf; print('packages ok')"
          if ($LASTEXITCODE -ne 0) { throw "packages missing in the private venv" }
          python "$env:RUNNER_TEMP\skills\web-research-pro\scripts\doctor.py" --offline
          ./install.ps1 -Dir "$env:RUNNER_TEMP\skills" -Uninstall
          if (Test-Path "$env:RUNNER_TEMP\skills\web-research-pro") { throw "uninstall failed" }
          $global:LASTEXITCODE = 0

  package:
    name: package .skill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/package_skill.py
      - uses: actions/upload-artifact@v4
        with:
          name: web-research-pro-skill
          path: dist/web-research-pro.skill
