name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: tests · ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.9" }
          - { os: ubuntu-latest, python: "3.13", chromium: true }
          - { os: macos-latest, python: "3.12" }
          - { os: windows-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            skills/web-research-pro/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install Playwright Chromium
        if: matrix.chromium
        run: python -m playwright install --with-deps chromium
      - name: Run tests
        run: python -m pytest -q

  installers:
    name: installer · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install.sh (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          bash install.sh --dir "$RUNNER_TEMP/skills" --no-browser
          python3 "$RUNNER_TEMP/skills/web-research-pro/scripts/doctor.py" --offline
          bash install.sh --dir "$RUNNER_TEMP/skills" --uninstall
          test ! -e "$RUNNER_TEMP/skills/web-research-pro"
      - name: install.ps1 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./install.ps1 -Dir "$env:RUNNER_TEMP\skills" -NoBrowser
          python "$env:RUNNER_TEMP\skills\web-research-pro\scripts\doctor.py" --offline
          ./install.ps1 -Dir "$env:RUNNER_TEMP\skills" -Uninstall
          if (Test-Path "$env:RUNNER_TEMP\skills\web-research-pro") { throw "uninstall failed" }

  package:
    name: package .skill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/package_skill.py
      - uses: actions/upload-artifact@v4
        with:
          name: web-research-pro-skill
          path: dist/web-research-pro.skill
