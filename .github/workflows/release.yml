name: Release

# Push a tag like v1.0.0 to publish a GitHub release with the .skill file attached.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the .skill package
        run: python tools/package_skill.py
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/web-research-pro.skill \
            --title "Web Research Pro $GITHUB_REF_NAME" \
            --notes "See CHANGELOG.md for what changed. Download **web-research-pro.skill** to upload it to claude.ai (Settings → Capabilities → Skills), or use the one-line installers from the README." \
            || gh release upload "$GITHUB_REF_NAME" dist/web-research-pro.skill --clobber
